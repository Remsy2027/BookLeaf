services:
  bookleaf:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3001"
    environment:
      # Local HTTP only. Use production plus an HTTPS proxy on a hosted deployment.
      NODE_ENV: ${NODE_ENV:-development}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DATABASE_PATH: /app/data/bookleaf.sqlite
      DEMO_PASSWORD: ${DEMO_PASSWORD:-BookLeafDemo!2026}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bookleaf.local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    volumes:
      - bookleaf-data:/app/data
    restart: unless-stopped
volumes:
  bookleaf-data:
